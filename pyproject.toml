[project]
name = "nyaya-ai"
version = "2.1.0"
description = "Document-grounded AI legal information assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.35,<1",
    "python-multipart>=0.0.20,<1",
    "openai>=1.100,<2",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "scikit-learn>=1.7,<2",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
]
coverage = [
    "pytest-cov>=6,<8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["nyayaai"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
